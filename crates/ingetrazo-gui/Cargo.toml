[package]
name = "ingetrazo-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
engineering-python = ["dep:ingetrazo-ai-interpreter-proof"]

[dependencies]
ingetrazo-ai-interpreter-proof = { path = "../../tools/ai-interpreter-proof", optional = true }

ingetrazo-core = { path = "../ingetrazo-core" }
ingetrazo-tools = { path = "../ingetrazo-tools" }
ingetrazo-formats = { path = "../ingetrazo-formats" }
ingetrazo-render = { path = "../ingetrazo-render" }
glam.workspace = true
egui.workspace = true
eframe.workspace = true
serde_json.workspace = true
serde.workspace = true
log.workspace = true
libc = "0.2"
image.workspace = true
blake3.workspace = true
thiserror.workspace = true
uuid.workspace = true

arboard = { version = "3.6.1", default-features = false }

ash = { version = "0.38", default-features = false, features = ["loaded", "std", "debug"] }
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
egui-winit = "0.30"
egui-ash-renderer = "=0.7.0"

bytemuck.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ingetrazo-metal = { path = "../ingetrazo-metal" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[example]]
name = "engineering_console_scene_fixture"
path = "examples/engineering_console_scene_fixture.rs"
required-features = ["engineering-python"]

[[example]]
name="engineering_console_history_fixture"
path="examples/engineering_console_history_fixture.rs"
required-features=["engineering-python"]

[[example]]
name="engineering_console_publication_failure"
path="examples/engineering_console_publication_failure.rs"
required-features=["engineering-python"]

[[example]]
name="engineering_console_rows_fixture"
path="examples/engineering_console_rows_fixture.rs"
required-features=["engineering-python"]

[[example]]
name="engineering_console_groups_fixture"
path="examples/engineering_console_groups_fixture.rs"
required-features=["engineering-python"]

[[example]]
name="engineering_console_recipes_fixture"
path="examples/engineering_console_recipes_fixture.rs"
required-features=["engineering-python"]

[[example]]
name="engineering_console_house_fixture"
path="examples/engineering_console_house_fixture.rs"
required-features=["engineering-python"]

[[example]]
name="engineering_console_imported_mesh_fixture"
path="examples/engineering_console_imported_mesh_fixture.rs"
required-features=["engineering-python"]

[[example]]
name = "engineering_console_affine_fixture"
required-features = ["engineering-python"]

[[example]]
name = "engineering_console_nested_fixture"
required-features = ["engineering-python"]

[dev-dependencies]
sha2 = "0.10"
