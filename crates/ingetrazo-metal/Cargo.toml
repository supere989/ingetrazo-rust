[package]
name = "ingetrazo-metal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ingetrazo-core = { path = "../ingetrazo-core" }
ingetrazo-render = { path = "../ingetrazo-render" }
bytemuck = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-metal = "=0.3.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSRange", "NSString"] }
