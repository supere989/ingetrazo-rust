[package]
name = "ingetrazo-metal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ingetrazo-core = { path = "../ingetrazo-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-metal = "=0.3.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSRange"] }

objc2-quartz-core = { version = "=0.3.2", features = ["CAMetalLayer", "CALayer", "objc2-metal"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSView"] }
objc2-core-foundation = "=0.3.2"
raw-window-handle = "0.6"
winit = "0.30"

egui.workspace = true
blake3 = { workspace = true, features = ["pure"] }
