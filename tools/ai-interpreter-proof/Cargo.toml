[package]
name = "ingetrazo-ai-interpreter-proof"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[features]
default = ["vm"]
vm = ["dep:rustpython-vm"]
[dependencies]
rustpython-vm = { version = "=0.6.0", optional = true, default-features = false, features = ["compiler", "gc", "importlib", "stdio"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ingetrazo-core = { path = "../../crates/ingetrazo-core" }
glam = "0.29"
num-bigint = "0.4"
num-traits = "0.2"
uuid = "1"
# Exact compiler parser graph used by the reviewed VM proof; newer Ruff requires Rust 1.97.
rustpython-ruff_python_ast = "=0.16.5"
rustpython-ruff_python_parser = "=0.16.5"
rustpython-ruff_python_trivia = "=0.16.5"
rustpython-ruff_source_file = "=0.16.5"
rustpython-ruff_text_size = "=0.16.5"

[profile.dev]
debug = 0
incremental = false

[patch.crates-io]
rustpython-vm = { path = "vendor/rustpython-vm" }
