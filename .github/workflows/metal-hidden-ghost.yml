name: Native Metal hidden ghost consumer
on:
  push:
    branches: [review/metal-hidden-ghost]
  workflow_dispatch:
concurrency:
  group: metal-hidden-ghost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-native-gpu:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          cache-bin: "false"
          cache-workspace-crates: "false"
      - name: Freeze runtime and materialize existing original12 only
        run: |
          mkdir -p metal-ghost-evidence
          git rev-parse HEAD > metal-ghost-evidence/revision.txt
          git ls-files crates/ingetrazo-formats/src/annotation_font.rs crates/ingetrazo-formats/src/paper_font.rs crates/ingetrazo-formats/src/paper_text.rs crates/ingetrazo-formats/src/paper_coretext_glyph.rs scripts/reference-macos-annotation-glyphs.py scripts/check-macos-annotation-glyphs.py scripts/check-metal-material-policy.py crates/ingetrazo-render/src crates/ingetrazo-tools/src crates/ingetrazo-core/src crates/ingetrazo-gui/src/tool_history.rs crates/ingetrazo-gui/src/navigation_ray.rs crates/ingetrazo-metal/src crates/ingetrazo-gui/src/native_metal crates/ingetrazo-gui/src/native_metal.rs scripts/check-metal-face-sweep.py scripts/check-metal-hidden-ghost.py scripts/check-metal-world-classic.py scripts/check-metal-world-material.py crates/ingetrazo-gui/examples/native_metal_face_sweep.rs crates/ingetrazo-gui/examples/native_metal_hidden_ghost.rs crates/ingetrazo-gui/examples/native_metal_world_classic.rs crates/ingetrazo-gui/examples/native_metal_world_material.rs | xargs shasum -a 256 > metal-ghost-evidence/source.sha256
          python3 scripts/check-metal-hidden-ghost.py docs/audits/hidden-ghost-workflow "$RUNNER_TEMP/metal-ghost-input" --unpack
          python3 scripts/check-metal-face-sweep.py docs/audits/face-sweep-label-source "$RUNNER_TEMP/metal-sweep-input" --unpack
      - name: Joint build of only four affected native app consumers
        run: |
          cargo build --locked -p ingetrazo-gui --example native_metal_hidden_ghost --example native_metal_world_classic --example native_metal_world_material --example native_metal_face_sweep -j2 > metal-ghost-evidence/build.log 2>&1
          shasum -a 256 target/debug/examples/native_metal_hidden_ghost target/debug/examples/native_metal_world_classic target/debug/examples/native_metal_world_material target/debug/examples/native_metal_face_sweep > metal-ghost-evidence/binary.sha256
      - name: Bounded actual macOS Qt sized glyph reference
        continue-on-error: true
        run: |
          python3 - <<'PYTHON'
          import os,subprocess,sys
          from pathlib import Path
          venv=Path(os.environ['RUNNER_TEMP'])/'metal-glyph-qt-venv'
          with open('metal-ghost-evidence/qt-glyph-reference.log','w') as log:
              subprocess.run([sys.executable,'-m','venv',str(venv)],stdout=log,stderr=subprocess.STDOUT,timeout=30,check=True)
              subprocess.run([str(venv/'bin/python'),'-m','pip','install','PySide6==6.12.0'],stdout=log,stderr=subprocess.STDOUT,timeout=180,check=True)
              subprocess.run([str(venv/'bin/python'),'scripts/reference-macos-annotation-glyphs.py','metal-ghost-evidence/qt-glyphs'],stdout=log,stderr=subprocess.STDOUT,timeout=60,check=True)
          PYTHON
      - name: Execute only ghost and affected retained material/classic consumers
        run: |
          python3 - <<'PYTHON'
          import json,os,subprocess
          from pathlib import Path
          jobs=[('sweep',['target/debug/examples/native_metal_face_sweep',os.environ['RUNNER_TEMP']+'/metal-sweep-input','metal-ghost-evidence/sweep']),('ghost',['target/debug/examples/native_metal_hidden_ghost',os.environ['RUNNER_TEMP']+'/metal-ghost-input','metal-ghost-evidence/native']),('classic',['target/debug/examples/native_metal_world_classic','metal-ghost-evidence/classic']),('material',['target/debug/examples/native_metal_world_material','metal-ghost-evidence/material'])]
          failed=False
          for name,cmd in jobs:
              try:
                  with open('metal-ghost-evidence/'+name+'-runtime.log','w') as log:
                      subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=120,check=True)
              except (subprocess.SubprocessError,OSError) as error:
                  failed=True
                  Path('metal-ghost-evidence/'+name+'-failure.json').write_text(json.dumps({'error_type':type(error).__name__,'error':str(error)}))
          raise SystemExit(1 if failed else 0)
          PYTHON
      - name: Check strict ghost pixels and retained material/classic regression controls
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/metal-ghost-check-venv"
          "$RUNNER_TEMP/metal-ghost-check-venv/bin/pip" install pillow
          "$RUNNER_TEMP/metal-ghost-check-venv/bin/python" - <<'PYTHON'
          import subprocess,sys
          jobs=[('material-policy','scripts/check-metal-material-policy.py','docs/audits/face-sweep-label-source','metal-ghost-evidence/sweep'),('sweep','scripts/check-metal-face-sweep.py','docs/audits/face-sweep-label-source','metal-ghost-evidence/sweep'),('ghost','scripts/check-metal-hidden-ghost.py','docs/audits/hidden-ghost-workflow','metal-ghost-evidence/native'),('classic','scripts/check-metal-world-classic.py','docs/audits/metal-world-scene/classic-source','metal-ghost-evidence/classic'),('material','scripts/check-metal-world-material.py','docs/audits/metal-world-scene/material-source','metal-ghost-evidence/material'),('font-attribution','scripts/check-macos-annotation-glyphs.py','metal-ghost-evidence/qt-glyphs','metal-ghost-evidence/sweep')]
          failed=False
          for name,checker,source,native in jobs:
              with open('metal-ghost-evidence/'+name+'-checker.log','w') as log:
                  try:
                      result=subprocess.run([sys.executable,checker,source,native],stdout=log,stderr=subprocess.STDOUT,timeout=90)
                      failed=failed or result.returncode!=0
                  except (subprocess.SubprocessError,OSError) as error:
                      failed=True
                      log.write(str(error)+'\n')
          raise SystemExit(1 if failed else 0)
          PYTHON
      - name: Compact successful or failed native captures without dependency environments
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil,zipfile
          root=Path('metal-ghost-evidence')
          root.mkdir(exist_ok=True)
          directories=[root/name for name in ['native','classic','material','sweep','qt-glyphs'] if (root/name).exists()]
          files=[p for directory in directories for p in sorted(directory.rglob('*')) if p.is_file()]
          archive=root/'native-captures.zip'
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
              for path in files:z.write(path,path.relative_to(root))
          with zipfile.ZipFile(archive) as z:
              for path in files:
                  assert z.read(path.relative_to(root).as_posix())==path.read_bytes()
          for directory in directories:shutil.rmtree(directory)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-hidden-ghost-${{ matrix.runner }}
          path: metal-ghost-evidence/
          if-no-files-found: error
