name: Rust and semantic acceptance
on: [push, pull_request]
jobs:
  metal-native-link:
    name: Native Metal framework link (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Native paper font dependency build and library tests
        run: |
          mkdir -p docs/audits/paper-font-native-ci
          cargo test --locked -p ingetrazo-formats --lib > docs/audits/paper-font-native-ci/tests.log 2>&1
          cargo run --locked -p ingetrazo-formats --example native_font_resource_probe -- /System/Library/Fonts/Supplemental/Arial.ttf > docs/audits/paper-font-native-ci/font-resource.log 2>&1
      - name: Link native device probe against Apple frameworks
        run: |
          mkdir -p docs/audits/metal-native-link-ci
          cargo build --locked -p ingetrazo-metal --example device_probe --example submission_probe --example cad2d_probe > docs/audits/metal-native-link-ci/build.log 2>&1
          file target/debug/examples/device_probe > docs/audits/metal-native-link-ci/binary.txt
          otool -L target/debug/examples/device_probe > docs/audits/metal-native-link-ci/frameworks.txt
      - name: Execute native Metal device and allocation probe
        run: target/debug/examples/device_probe > docs/audits/metal-native-link-ci/device-and-allocation.log 2>&1
      - name: Execute native Metal GPU submission and retirement probe
        run: target/debug/examples/submission_probe > docs/audits/metal-native-link-ci/gpu-submission.log 2>&1
      - name: Execute strict source-ordered Metal compute rendering
        run: |
          target/debug/examples/cad2d_probe --compute --output=docs/audits/metal-native-link-ci/compute > docs/audits/metal-native-link-ci/compute-render.log 2>&1
      - name: Execute Apple framebuffer-fetch rendering or explicit capability refusal
        run: |
          target/debug/examples/cad2d_probe --allow-unsupported --output=docs/audits/metal-native-link-ci/fetch > docs/audits/metal-native-link-ci/fetch-render.log 2>&1
      - name: Actual completed and pending Metal CAD Drop ownership
        run: cargo test --locked -p ingetrazo-metal cad_drop_controls -- --nocapture > docs/audits/metal-native-link-ci/cad-drop.log 2>&1
      - name: Reject literal old GPU byte multiplication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('cad2d.metal','cad2d_spans.metal'):
              p=Path('crates/ingetrazo-metal/src/shaders')/name
              s=p.read_text()
              old='(t+(t>>8)+128)>>8'
              assert s.count(old)==1
              p.write_text(s.replace(old,'(t+128)>>8'))
          PY
          cargo build --locked -p ingetrazo-metal --example cad2d_probe > docs/audits/metal-native-link-ci/negative-build.log 2>&1
          if target/debug/examples/cad2d_probe --compute --output=docs/audits/metal-native-link-ci/negative-compute > docs/audits/metal-native-link-ci/negative-compute.log 2>&1; then
            echo "Old shader law unexpectedly passed"; exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          s=Path('docs/audits/metal-native-link-ci/negative-compute.log').read_text()
          assert 'backend=exact source-ordered span compute' in s
          assert 'Strict actualQPainter whole-image comparison failed' in s
          assert 'different_pixels=' in s
          assert 'Metal shader compile:' not in s
          PY
      - name: Retain native linking evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-metal-link-${{ matrix.runner }}
          path: |
            docs/audits/metal-native-link-ci/
            docs/audits/paper-font-native-ci/
          if-no-files-found: error
  metal-cross-compilation:
    name: Native Metal compile (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check native Metal library and device probe
        run: |
          mkdir -p docs/audits/metal-cross-ci
          cargo check --locked -p ingetrazo-metal --all-targets --target ${{ matrix.target }} > docs/audits/metal-cross-ci/check.log 2>&1
      - name: Retain compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-metal-compile-${{ matrix.target }}
          path: docs/audits/metal-cross-ci/
          if-no-files-found: error
  compilation-and-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y file libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libudev-dev libssl-dev libegl1 libgl1 libdbus-1-3 libfreetype6 libfontconfig1 fontconfig libx11-6 libxrandr2 libxcursor1 libxi6 libxinerama1 libxkbcommon-x11-0 xvfb xauth imagemagick pkg-config libxtst6 libgl1-mesa-dri libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libvulkan1 mesa-vulkan-drivers zenity
      - name: Check mandatory original fixtures
        run: python3 -c "from pathlib import Path; names = [\"arco-yanque\", \"banca-pergola-yanque\", \"luminaria-solar-yanque\", \"pileta-fuente-yanque\"]; assert all((Path(\"ingetrazo/examples\") / (n + \".igz\")).is_file() for n in names), \"Missing original fixtures\""
      - run: cargo test --workspace --locked
      - name: Native isolated X11 clipboard acceptance
        run: python3 scripts/check-native-clipboard.py
      - name: Native rendered Offset viewport gestures
        run: python3 scripts/check-rendered-offset.py
      - name: Build native launcher and minimal render worker
        run: cargo build --locked -p ingetrazo-cli -p ingetrazo-render --bin ingetrazo --bin ingetrazo-render-worker
      - name: Persistent shared-buffer HLR and worker deadline controls
        run: cargo run --locked -p ingetrazo-render --example process_hlr_acceptance -- target/debug/ingetrazo-render-worker
      - name: Build direct Vulkan host and allocation probe
        run: cargo build --locked -p ingetrazo-gui --example native_vulkan --example native_vulkan_budget_probe --example native_vulkan_headless_probe --example native_vulkan_contour_chunks_probe --example native_vulkan_upload_churn --example native_vulkan_texture_upload_probe
      - name: Direct Vulkan virtual-display lifecycle
        run: python3 scripts/check-native-vulkan-startup.py target/debug/examples/native_vulkan docs/audits/native-vulkan-ci-host
      - name: Actual Vulkan image and staging denial rollback
        run: python3 scripts/check-native-vulkan-startup.py target/debug/examples/native_vulkan_budget_probe docs/audits/native-vulkan-ci-budget
      - name: Headless software Vulkan resource depth refusal and timeout controls
        run: python3 scripts/check-headless-vulkan-software.py target/debug/examples/native_vulkan_headless_probe docs/audits/headless-vulkan-ci
      - name: Headless contour chunk equality and allocation rollback
        run: |
          mkdir -p docs/audits/contour-chunks-ci
          timeout 30s target/debug/examples/native_vulkan_contour_chunks_probe --software-fixture --output docs/audits/contour-chunks-ci/hollow.png > docs/audits/contour-chunks-ci/probe.log 2>&1
      - name: Batched transfer readback and transactional ownership controls
        run: |
          mkdir -p docs/audits/upload-many-ci
          timeout 30s target/debug/examples/native_vulkan_upload_churn --software-fixture > docs/audits/upload-many-ci/result.json 2> docs/audits/upload-many-ci/runtime.log
      - name: Native texture image mip staging and pressure controls
        run: |
          mkdir -p docs/audits/texture-upload-ci
          timeout 40s target/debug/examples/native_vulkan_texture_upload_probe --software-fixture > docs/audits/texture-upload-ci/probe.log 2>&1
      - name: Software-rendered virtual-display startup
        run: scripts/render-smoke.sh
      - name: Semantic document acceptance
        run: python3 scripts/check-document-parity.py
      - name: Independent export buffer acceptance
        run: python3 scripts/check-export-parity.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned original runtime in CI environment
        run: python -m pip install -r docs/audits/python-runtime-freeze.txt
      - name: Original native Fontconfig request matching and ownership
        run: |
          mkdir -p docs/audits/font-resolver-ci
          python scripts/probe-python-paper-text.py docs/audits/font-resolver-ci/original
          cargo run --locked -p ingetrazo-formats --example paper_font_resolver_fixture -- docs/audits/font-resolver-ci/original/font-observations.json docs/audits/font-resolver-ci/native.json
      - name: Actual original paragraph layout and direct PDF text
        run: |
          mkdir -p docs/audits/paragraph-ci
          INGETRAZO_TEXT_EXPANDED=1 INGETRAZO_TEXT_PARAGRAPHS=1 python scripts/probe-python-paper-text.py docs/audits/paragraph-ci/original
          cargo run --locked -p ingetrazo-formats --example paper_paragraph_fixture -- docs/audits/paragraph-ci/original/font-observations.json docs/audits/paragraph-ci/native
          INGETRAZO_TEXT_PARAGRAPHS=1 python scripts/check-paper-text-layout-pages.py docs/audits/paragraph-ci/original docs/audits/paragraph-ci/native 72
          INGETRAZO_TEXT_PARAGRAPHS=1 python scripts/check-paper-text-layout-pages.py docs/audits/paragraph-ci/original docs/audits/paragraph-ci/native 144
          INGETRAZO_TEXT_PARAGRAPHS=1 python scripts/check-paper-text-layout-pages.py docs/audits/paragraph-ci/original docs/audits/paragraph-ci/native 300
          INGETRAZO_TEXT_PARAGRAPHS=1 python scripts/check-paper-text-layout-unicode.py docs/audits/paragraph-ci/original docs/audits/paragraph-ci/native
          INGETRAZO_TEXT_PARAGRAPHS=1 python scripts/check-paper-text-layout-negatives.py docs/audits/paragraph-ci/original docs/audits/paragraph-ci/native
      - name: Original and native strict vector View PDF pages
        run: QT_QPA_PLATFORM=offscreen CARGO_TARGET_DIR=target python scripts/check-composer-vector-view-pdf.py docs/audits/vector-view-ci
      - name: Original and native saved-view PDF state against opposed live state
        run: INGETRAZO_VIEW_PDF_SAVED=1 QT_QPA_PLATFORM=offscreen CARGO_TARGET_DIR=target python scripts/check-composer-vector-view-pdf.py docs/audits/saved-vector-view-ci
      - name: Exact source section loops clipping and plane axes
        run: |
          mkdir -p docs/audits/section-numerics-ci
          python scripts/probe-python-paper-section.py docs/audits/section-numerics-ci/source.json
          cargo run --locked -p ingetrazo-render --example paper_section_fixture -- docs/audits/section-numerics-ci/source.json
      - name: Original and native strict solid section PDF pages
        run: INGETRAZO_VIEW_PDF_FILL=solid QT_QPA_PLATFORM=offscreen CARGO_TARGET_DIR=target python scripts/check-composer-vector-view-pdf.py docs/audits/section-solid-ci
      - name: Original and native saved tilted cropped colored hatch PDF pages
        run: INGETRAZO_VIEW_PDF_FILL=hatch INGETRAZO_VIEW_PDF_SAVED=1 INGETRAZO_VIEW_PDF_SECTION_TILT=1 INGETRAZO_VIEW_PDF_SCALE=20 INGETRAZO_VIEW_PDF_HATCH=0.7 INGETRAZO_VIEW_PDF_FILL_COLOR="#dc9b4e" QT_QPA_PLATFORM=offscreen CARGO_TARGET_DIR=target python scripts/check-composer-vector-view-pdf.py docs/audits/section-heldout-hatch-ci
      - name: Actual source grid cutoff spacing and perspective suppression
        run: |
          mkdir -p docs/audits/grid-source-ci
          python scripts/probe-python-paper-grid.py docs/audits/grid-source-ci/source.json
          python -c "import json; assert json.load(open('docs/audits/grid-source-ci/source.json')) == json.load(open('docs/audits/sheet-view-grid-pdf/source-grid-controls.json'))"
      - name: Original and native strict physical grid and hatch pages
        run: INGETRAZO_VIEW_PDF_GRID=0.7 INGETRAZO_VIEW_PDF_FILL=hatch QT_QPA_PLATFORM=offscreen CARGO_TARGET_DIR=target python scripts/check-composer-vector-view-pdf.py docs/audits/grid-default-ci
      - name: Original and native noninteger grid saved tilted solid pages
        run: INGETRAZO_VIEW_PDF_GRID=0.3317 INGETRAZO_VIEW_PDF_FILL=solid INGETRAZO_VIEW_PDF_SAVED=1 INGETRAZO_VIEW_PDF_SECTION_TILT=1 QT_QPA_PLATFORM=offscreen CARGO_TARGET_DIR=target python scripts/check-composer-vector-view-pdf.py docs/audits/grid-heldout-ci
      - name: Actual composer PDF save dialogs and refusal preservation
        run: |
          cargo build --locked -p ingetrazo-gui --example composer_pdf_ui_fixture
          QT_QPA_PLATFORM=offscreen CARGO_TARGET_DIR=target python scripts/check-composer-pdf-ui.py
          QT_QPA_PLATFORM=offscreen INGETRAZO_PDF_UI_UNSUPPORTED=1 CARGO_TARGET_DIR=target python scripts/check-composer-pdf-ui.py
      - name: Actual Text composer export source pages and save dialogs
        run: |
          mkdir -p docs/audits/composer-text-ci
          cargo run --locked -p ingetrazo-gui --example composer_text_pdf_fixture -- docs/audits/paragraph-ci/original/font-observations.json docs/audits/composer-text-ci/native
          for dpi in 72 144 300; do INGETRAZO_TEXT_PARAGRAPHS=1 python scripts/check-paper-text-layout-pages.py docs/audits/paragraph-ci/original docs/audits/composer-text-ci/native "$dpi"; done
          INGETRAZO_TEXT_PARAGRAPHS=1 python scripts/check-paper-text-layout-unicode.py docs/audits/paragraph-ci/original docs/audits/composer-text-ci/native
          INGETRAZO_TEXT_PARAGRAPHS=1 python scripts/check-paper-text-layout-negatives.py docs/audits/paragraph-ci/original docs/audits/composer-text-ci/native
          QT_QPA_PLATFORM=offscreen INGETRAZO_PDF_UI_TEXT_OBSERVATIONS=docs/audits/paragraph-ci/original/font-observations.json INGETRAZO_PDF_UI_EVIDENCE=docs/audits/composer-text-ci/ui CARGO_TARGET_DIR=target python scripts/check-composer-pdf-ui.py
      - name: Original punctuation and discretionary Text boundaries
        run: |
          for family in LINEBREAKS SHY_BOUNDARIES; do
            export INGETRAZO_TEXT_${family}=1
            out=docs/audits/text-boundaries-ci/$family
            QT_QPA_PLATFORM=offscreen python scripts/probe-python-paper-text.py "$out/original"
            cargo run --locked -p ingetrazo-formats --example paper_paragraph_fixture -- "$out/original/font-observations.json" "$out/native"
            for dpi in 72 144 300; do QT_QPA_PLATFORM=offscreen python scripts/check-paper-text-layout-pages.py "$out/original" "$out/native" "$dpi"; done
            unset INGETRAZO_TEXT_${family}
          done
      - name: Actual Text background export and save dialogs
        run: |
          mkdir -p docs/audits/composer-background-ci/original
          INGETRAZO_TEXT_BACKGROUNDS=1 QT_QPA_PLATFORM=offscreen python scripts/probe-python-paper-text.py docs/audits/composer-background-ci/original
          cargo run --locked -p ingetrazo-gui --example composer_text_pdf_fixture -- docs/audits/composer-background-ci/original/font-observations.json docs/audits/composer-background-ci/native
          for dpi in 72 144 300; do QT_QPA_PLATFORM=offscreen python scripts/check-paper-text-background-pages.py docs/audits/composer-background-ci/original docs/audits/composer-background-ci/native "$dpi"; done
          QT_QPA_PLATFORM=offscreen INGETRAZO_PDF_UI_TEXT_OBSERVATIONS=docs/audits/composer-background-ci/original/font-observations.json INGETRAZO_PDF_UI_EVIDENCE=docs/audits/composer-background-ci/ui CARGO_TARGET_DIR=target python scripts/check-composer-pdf-ui.py
      - name: Exact original Qt and production CAD color protocol
        run: |
          mkdir -p docs/audits/cad2d-color-ci
          QT_QPA_PLATFORM=offscreen python scripts/reference-qt-cad-span-multiply.py > docs/audits/cad2d-color-ci/byte-span-law.json
          QT_QPA_PLATFORM=offscreen python scripts/reference-qt-cad2d-premultiply.py docs/audits/cad2d-color-ci/original
          cargo run --locked -p ingetrazo-render --example cad2d_premultiply_protocol -- docs/audits/cad2d-color-ci/native.bin
          QT_QPA_PLATFORM=offscreen python scripts/check-cad2d-premultiply.py docs/audits/cad2d-color-ci/original docs/audits/cad2d-color-ci/native.bin --output docs/audits/cad2d-color-ci/result.json
      - name: Build production native composer cache fixture
        run: cargo build --locked -p ingetrazo-gui --example composer_native_cache
      - name: Native Vulkan composer cache edit history context and recovery
        run: python scripts/check-native-composer-cache.py target/debug/examples/composer_native_cache target/debug/ingetrazo-render-worker docs/audits/native-composer-ci
      - name: Classified composer view DXF and transactional writer acceptance
        run: |
          python scripts/check-sheet-view-dxf.py
          INGETRAZO_DXF_OUTPUT=docs/audits/sheet-export-ci QT_QPA_PLATFORM=offscreen python scripts/check-composer-view-dxf.py
      - name: Original Move policy and short rendered drag controls
        run: |
          QT_QPA_PLATFORM=offscreen python scripts/check-python-move-inference.py
          INGETRAZO_MOVE_DISTANCE=.05 INGETRAZO_CENTER_RUN_SUFFIX=-short-ci python scripts/check-native-center-tracking.py
          INGETRAZO_MOVE_DISTANCE=.05 INGETRAZO_CENTER_RUN_SUFFIX=-short-ci INGETRAZO_CENTER_ORIGINAL=1 python scripts/check-native-center-tracking.py
      - name: Original orthographic screen snapping controls
        run: python scripts/check-python-screen-snap.py
      - name: Original perspective snapping and eye boundary controls
        run: |
          QT_QPA_PLATFORM=offscreen python scripts/check-python-snap-eye-boundary.py
          QT_QPA_PLATFORM=offscreen python scripts/check-python-snap-heldout-depth.py
      - name: Independently calibrated center glyph positive and negative controls
        run: python scripts/check-center-hint-glyph-calibration.py docs/audits/center-hint-classification-independent
      - name: Actual original and native center hint and Move UI controls
        run: |
          for mode in curve tiny malformed; do
            INGETRAZO_CENTER_MODE="$mode" INGETRAZO_CENTER_EXPECT_HINT=1 INGETRAZO_CENTER_RUN_SUFFIX=-ci python scripts/check-native-center-tracking.py
            INGETRAZO_CENTER_MODE="$mode" INGETRAZO_CENTER_RUN_SUFFIX=-ci INGETRAZO_CENTER_ORIGINAL=1 python scripts/check-native-center-tracking.py
          done
      - name: Rendered software OpenGL drawing reference gestures
        run: python scripts/check-rendered-drawing-reference.py
      - name: Rendered software OpenGL temporary Shift inference gestures
        run: python scripts/check-rendered-shift-inference.py
      - name: Original OpenGL section stencil controls
        run: python scripts/check-original-section-gl.py
      - name: Build native Vulkan section fixture
        run: cargo build --locked -p ingetrazo-gui --example native_vulkan_section_fixture
      - name: Native Vulkan ten-case stencil comparison and lifecycle
        run: python scripts/check-native-vulkan-stencil-suite.py target/debug/examples/native_vulkan_section_fixture docs/audits/native-stencil-ci
      - name: Native rendered section stencil comparison
        run: python scripts/check-rendered-section.py
      - name: Original Python runtime document reopen
        run: python scripts/check-python-reopen.py
      - name: Original Python runtime fresh and edited Rust interpretation
        run: python scripts/check-python-edits.py
      - name: Original Python versus Rust boolean shape acceptance
        run: python scripts/check-python-booleans.py
      - name: Original Python PushPull reference regressions
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ingetrazo
        run: python -m pytest -q ingetrazo/tests/test_pushpull_subtractive.py ingetrazo/tests/test_pushpull_orient.py
      - name: Original Python versus Rust PushPull shape acceptance
        run: python scripts/check-python-pushpull.py
      - name: Original Python versus Rust connected sweep geometry
        run: python scripts/check-python-followme.py
      - name: Original Python shared component definition acceptance
        run: python scripts/check-python-components.py
      - name: Independent COLLADA export geometry and original reopening
        run: python scripts/check-python-dae-export.py
      - name: Original runtime physical pieces geometry
        run: python scripts/check-python-pieces.py
      - name: Original runtime nested world dimension measurement
        run: python scripts/check-python-dimension-world.py
      - name: Original terrain runtime visibility and owned command footprint
        run: |
          mkdir -p docs/audits/terrain-membership-ci
          python scripts/probe-python-presentation-history.py docs/audits/terrain-membership-ci/original.json
          cargo run --locked -p ingetrazo-gui --example presentation_history_fixture -- docs/audits/terrain-membership-ci/native
          python scripts/check-terrain-command-ownership.py docs/audits/terrain-membership-ci/original.json docs/audits/terrain-membership-ci/native/native.json docs/audits/saved-view-command-ownership/native.json docs/audits/terrain-command-ownership/bool-only-negative.json
      - name: Original saved-view command membership and object lifetime
        run: |
          mkdir -p docs/audits/savedview-membership-ci
          python scripts/probe-python-presentation-history.py docs/audits/savedview-membership-ci/original.json
          cargo run --locked -p ingetrazo-gui --example presentation_history_fixture -- docs/audits/savedview-membership-ci/native
          python scripts/check-saved-view-membership.py docs/audits/savedview-membership-ci/original.json docs/audits/savedview-membership-ci/native/native.json docs/audits/presentation-history/native-baseline.json
      - name: Original parked-context layer deletion ownership
        run: |
          mkdir -p docs/audits/layer-context-ci
          python scripts/probe-python-layer-context-delete.py docs/audits/layer-context-ci/original.json
          cargo run --locked -p ingetrazo-gui --example layer_context_delete_fixture -- docs/audits/layer-context-ci/native
          python scripts/check-layer-context-delete.py docs/audits/layer-context-ci/original.json docs/audits/layer-context-ci/native/native.json docs/audits/layer-context-deletion/baseline-native.json
      - name: Original layer panel and command ownership
        run: |
          mkdir -p docs/audits/layer-membership-ci
          python scripts/probe-python-layer-history.py docs/audits/layer-membership-ci/original.json
          cargo run --locked -p ingetrazo-gui --example layer_history_fixture -- docs/audits/layer-membership-ci/native
          python scripts/check-layer-command-ownership.py docs/audits/layer-membership-ci/original.json docs/audits/layer-membership-ci/native/native.json docs/audits/layer-command-ownership/baseline-native.json
      - name: Original global entities survive nested edit history
        run: |
          mkdir -p docs/audits/context-globals-ci
          python scripts/probe-python-context-globals.py docs/audits/context-globals-ci/original.json
          cargo run --locked -p ingetrazo-gui --example context_globals_fixture -- docs/audits/context-globals-ci/native
          python scripts/check-context-globals.py docs/audits/context-globals-ci/original.json docs/audits/context-globals-ci/native/native.json docs/audits/context-global-publication/literal-old-entry-failure.log
      - name: Original referenced textures survive nested context history
        run: |
          python scripts/probe-python-context-textures.py docs/audits/context-textures-ci/original
          cargo run --locked -p ingetrazo-gui --example context_texture_clipboard_fixture -- docs/audits/context-textures-ci/original docs/audits/context-textures-ci/native
          python scripts/check-context-textures.py docs/audits/context-textures-ci/original docs/audits/context-textures-ci/native docs/audits/context-texture-history/missing-image-baseline
      - name: Original command-specific annotation shareback Undo and anchor lifetimes
        run: INGETRAZO_SHAREBACK_EVIDENCE=docs/audits/shareback-annotations-ci python scripts/check-python-shareback-annotations.py
      - name: Original runtime dimension anchors and nested outliner
        run: python scripts/check-python-dimension-anchors.py
      - name: Original runtime planar healing
        run: python scripts/check-python-heal.py
      - name: Original COLLADA editable geometry materials and resource import
        run: python scripts/check-python-dae-import.py
      - name: Original COLLADA nonaffine UV fitting and editable station topology
        run: python scripts/check-python-dae-uv-fit.py
      - name: Original COLLADA reference threshold shared prototypes and transformed textures
        run: python scripts/check-python-dae-reference.py
      - name: Original paper HLR endpoints classes and even-odd section coverage
        run: python scripts/check-python-composer-hlr.py
      - name: Original and native production composer pen and dash pixels
        run: python scripts/check-rendered-composer-ink.py .
      - name: Original Line Rectangle Freehand drafting semantics
        run: python scripts/check-python-drafting.py
      - name: Original image Move and context lifetime semantics
        run: |
          mkdir -p docs/audits/image-tools-ci
          python scripts/probe-python-image-move.py docs/audits/image-tools-ci/move-original.json
          python scripts/probe-python-selection-remove.py docs/audits/image-tools-ci/modifiers-original.json
