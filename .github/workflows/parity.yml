name: Rust and semantic acceptance
on: [push, pull_request]
jobs:
  compilation-and-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libudev-dev libssl-dev libegl1 libgl1 libdbus-1-3 libfreetype6 libfontconfig1 libx11-6 libxrandr2 libxcursor1 libxi6 libxinerama1 libxkbcommon-x11-0 xvfb xauth imagemagick pkg-config libxtst6 libgl1-mesa-dri libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libvulkan1 mesa-vulkan-drivers
      - name: Check mandatory original fixtures
        run: python3 -c "from pathlib import Path; names = [\"arco-yanque\", \"banca-pergola-yanque\", \"luminaria-solar-yanque\", \"pileta-fuente-yanque\"]; assert all((Path(\"ingetrazo/examples\") / (n + \".igz\")).is_file() for n in names), \"Missing original fixtures\""
      - run: cargo test --workspace --locked
      - name: Native isolated X11 clipboard acceptance
        run: python3 scripts/check-native-clipboard.py
      - name: Native rendered Offset viewport gestures
        run: python3 scripts/check-rendered-offset.py
      - name: Build native launcher and minimal render worker
        run: cargo build --locked -p ingetrazo-cli -p ingetrazo-render --bin ingetrazo --bin ingetrazo-render-worker
      - name: Persistent shared-buffer HLR and worker deadline controls
        run: cargo run --locked -p ingetrazo-render --example process_hlr_acceptance -- target/debug/ingetrazo-render-worker
      - name: Build direct Vulkan host and allocation probe
        run: cargo build --locked -p ingetrazo-gui --example native_vulkan --example native_vulkan_budget_probe
      - name: Direct Vulkan virtual-display lifecycle
        run: python3 scripts/check-native-vulkan-startup.py target/debug/examples/native_vulkan docs/audits/native-vulkan-ci-host
      - name: Actual Vulkan image and staging denial rollback
        run: python3 scripts/check-native-vulkan-startup.py target/debug/examples/native_vulkan_budget_probe docs/audits/native-vulkan-ci-budget
      - name: Software-rendered virtual-display startup
        run: scripts/render-smoke.sh
      - name: Semantic document acceptance
        run: python3 scripts/check-document-parity.py
      - name: Independent export buffer acceptance
        run: python3 scripts/check-export-parity.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned original runtime in CI environment
        run: python -m pip install -r docs/audits/python-runtime-freeze.txt
      - name: Build production native composer cache fixture
        run: cargo build --locked -p ingetrazo-gui --example composer_native_cache
      - name: Native Vulkan composer cache edit history context and recovery
        run: python scripts/check-native-composer-cache.py target/debug/examples/composer_native_cache target/debug/ingetrazo-render-worker docs/audits/native-composer-ci
      - name: Original orthographic screen snapping controls
        run: python scripts/check-python-screen-snap.py
      - name: Rendered software OpenGL drawing reference gestures
        run: python scripts/check-rendered-drawing-reference.py
      - name: Rendered software OpenGL temporary Shift inference gestures
        run: python scripts/check-rendered-shift-inference.py
      - name: Original OpenGL section stencil controls
        run: python scripts/check-original-section-gl.py
      - name: Build native Vulkan section fixture
        run: cargo build --locked -p ingetrazo-gui --example native_vulkan_section_fixture
      - name: Native Vulkan ten-case stencil comparison and lifecycle
        run: python scripts/check-native-vulkan-stencil-suite.py target/debug/examples/native_vulkan_section_fixture docs/audits/native-stencil-ci
      - name: Native rendered section stencil comparison
        run: python scripts/check-rendered-section.py
      - name: Original Python runtime document reopen
        run: python scripts/check-python-reopen.py
      - name: Original Python runtime fresh and edited Rust interpretation
        run: python scripts/check-python-edits.py
      - name: Original Python versus Rust boolean shape acceptance
        run: python scripts/check-python-booleans.py
      - name: Original Python PushPull reference regressions
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ingetrazo
        run: python -m pytest -q ingetrazo/tests/test_pushpull_subtractive.py ingetrazo/tests/test_pushpull_orient.py
      - name: Original Python versus Rust PushPull shape acceptance
        run: python scripts/check-python-pushpull.py
      - name: Original Python versus Rust connected sweep geometry
        run: python scripts/check-python-followme.py
      - name: Original Python shared component definition acceptance
        run: python scripts/check-python-components.py
      - name: Independent COLLADA export geometry and original reopening
        run: python scripts/check-python-dae-export.py
      - name: Original runtime physical pieces geometry
        run: python scripts/check-python-pieces.py
      - name: Original runtime nested world dimension measurement
        run: python scripts/check-python-dimension-world.py
      - name: Original runtime dimension anchors and nested outliner
        run: python scripts/check-python-dimension-anchors.py
      - name: Original runtime planar healing
        run: python scripts/check-python-heal.py
      - name: Original COLLADA editable geometry materials and resource import
        run: python scripts/check-python-dae-import.py
      - name: Original COLLADA nonaffine UV fitting and editable station topology
        run: python scripts/check-python-dae-uv-fit.py
      - name: Original COLLADA reference threshold shared prototypes and transformed textures
        run: python scripts/check-python-dae-reference.py
      - name: Original paper HLR endpoints classes and even-odd section coverage
        run: python scripts/check-python-composer-hlr.py
      - name: Original and native production composer pen and dash pixels
        run: python scripts/check-rendered-composer-ink.py .
      - name: Original Line Rectangle Freehand drafting semantics
        run: python scripts/check-python-drafting.py
      - name: Original geographic path conversion topology
        run: python scripts/check-python-geopath-conversion.py
      - name: Ctrl PushPull literal success and intentional safety boundaries
        run: python scripts/check-python-ctrl-pushpull.py
      - name: Original simplification geometry and protected attributes
        run: python scripts/check-python-simplify.py
      - name: Original interior partition orientation oracle
        run: python scripts/check-python-orient.py
      - name: Original offset regions and chains
        run: python scripts/check-python-offset.py
      - name: Original Offset hard-edge display semantics
        run: python scripts/check-python-offset-display.py
      - name: Original runtime saved view recall
        run: python scripts/check-python-saved-views.py
      - name: Original runtime polygon intersection segments and mutation
        run: python scripts/check-python-intersect.py
      - name: Original runtime dimension schema and placement
        run: python scripts/check-python-dimensions.py
      - name: Original runtime authored glTF reference imports
        run: python scripts/check-python-gltf-import.py
      - name: Original runtime mixed clipboard geometry
        run: python scripts/check-python-clipboard.py
      - name: Clipboard context and resource boundary oracle
        run: python scripts/check-python-clipboard-boundary.py
      - name: Original painted overlap paste oracle
        run: python scripts/check-python-clipboard-overlap.py
      - name: Original Python versus Rust fillet geometry
        run: python scripts/check-python-fillet.py
      - name: Independent nested mesh exchange geometry
        run: python scripts/check-exchange-exports.py
      - name: Original runtime exchange import semantics
        run: python scripts/audit-exchange-imports.py
      - name: Independent DXF curve and refusal boundaries
        run: python scripts/check-dxf-curves.py
      - name: Retain semantic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-parity-evidence
          path: |
            docs/audits/*semantic-evidence.*
            docs/audits/python-*-evidence.json
            docs/audits/render-pergola.png
            docs/audits/render-startup.log
            docs/audits/exchange-*-evidence.json
            docs/audits/dxf-curve-evidence.json
            docs/audits/section-original-gl/*
            docs/audits/section-rust-render/*
            docs/audits/offset-render/*.png
            docs/audits/offset-render/runtime.log
            docs/audits/native-vulkan-ci-host/*
            docs/audits/native-vulkan-ci-budget/*
            docs/audits/native-composer-ci/*.png
            docs/audits/native-composer-ci/native.log
            docs/audits/native-composer-ci/result.json
            docs/audits/python-screen-snap-evidence.json
            docs/audits/drawing-reference-render-evidence.json
            docs/audits/drawing-reference-render/*.png
            docs/audits/drawing-reference-render/runtime.log
            docs/audits/shift-inference-render-evidence.json
            docs/audits/shift-inference-render/*.png
            docs/audits/shift-inference-render/runtime.log
            docs/audits/native-stencil-ci/comparison.json
            docs/audits/native-stencil-ci/provenance.json
            docs/audits/native-stencil-ci/*/*.png
            docs/audits/native-stencil-ci/*/startup.log
