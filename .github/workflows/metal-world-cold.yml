name: Native Metal Intel cold World diagnostic
on:
  push:
    branches: [review/metal-world-cold]
  workflow_dispatch:
concurrency:
  group: metal-world-cold-${{ github.ref }}
  cancel-in-progress: false
jobs:
  app-consumer:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Reuse compiled Cargo dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-bin: "false"
          cache-workspace-crates: "false"
          cache-on-failure: "true"
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build only the closed World diagnostic
        run: |
          mkdir -p world-cold-evidence
          git rev-parse HEAD > world-cold-evidence/revision.txt
          git ls-files crates/ingetrazo-gui/src/native_metal crates/ingetrazo-gui/src/native_metal.rs crates/ingetrazo-gui/src/viewport.rs crates/ingetrazo-metal/src crates/ingetrazo-gui/examples/native_metal_world_cold.rs | xargs shasum -a 256 > world-cold-evidence/source.sha256
          cargo build --locked -p ingetrazo-gui --example native_metal_world_cold -j2 > world-cold-evidence/build.log 2>&1
          shasum -a 256 target/debug/examples/native_metal_world_cold > world-cold-evidence/binary.sha256
      - name: Observe four closed-only ownership cells
        run: |
          python3 - <<'PYTHON'
          import subprocess
          with open('world-cold-evidence/runtime.log','w') as log:
              subprocess.run(['target/debug/examples/native_metal_world_cold','world-cold-evidence/native'],stdout=log,stderr=subprocess.STDOUT,timeout=90,check=True)
          PYTHON
      - name: Validate finite observation inventory only
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PYTHON'
          import json, pathlib
          root=pathlib.Path('world-cold-evidence/native')
          report=json.loads((root/'report.json').read_text())
          assert len(report['frames'])==16
          for reuse in ['reused','fresh']:
              for route in ['native','compute']:
                  cell=f'{reuse}-{route}'
                  assert (root/f'{cell}-seed.rgba').stat().st_size==1920000
                  for i in range(4):
                      assert (root/f'{cell}-{i}.rgba').stat().st_size==1920000
                      row=json.loads((root/f'{cell}-{i}.json').read_text())
                      assert row['cell']==cell and row['iteration']==i
                      assert row['submission']['status']=='Completed'
                      assert row['submission']['readback']['storage']=='Shared'
                      assert row['submission']['resolve_route']['path']==('compute' if route=='compute' else 'untouched-native-reference')
          print('Complete diagnostic inventory; pixel differences remain observations')
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-cold-${{ matrix.runner }}
          path: world-cold-evidence/
          if-no-files-found: error
