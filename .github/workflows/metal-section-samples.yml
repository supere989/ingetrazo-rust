name: Native Metal closed-section sample observation
on:
  push:
    branches: [review/metal-section-samples]
  workflow_dispatch:
concurrency:
  group: metal-section-samples-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-consumer:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Reuse compiled Cargo dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-bin: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build only the four-pixel diagnostic
        run: |
          mkdir -p section-sample-evidence
          git rev-parse HEAD > section-sample-evidence/revision.txt
          git ls-files crates/ingetrazo-gui/src/native_metal crates/ingetrazo-gui/src/native_metal.rs crates/ingetrazo-gui/src/viewport.rs crates/ingetrazo-metal/src crates/ingetrazo-gui/examples/native_metal_section_samples.rs scripts/check-section-sample-observation.py | xargs shasum -a 256 > section-sample-evidence/source.sha256
          cargo build --locked -p ingetrazo-gui --example native_metal_section_samples -j2 > section-sample-evidence/build.log 2>&1
          shasum -a 256 target/debug/examples/native_metal_section_samples > section-sample-evidence/binary.sha256
      - name: Observe sixteen samples through the actual World encoder
        run: |
          python3 - <<'PYTHON'
          import subprocess
          with open('section-sample-evidence/runtime.log','w') as log:
              subprocess.run(['target/debug/examples/native_metal_section_samples','section-sample-evidence/native'],stdout=log,stderr=subprocess.STDOUT,timeout=30,check=True)
          PYTHON
      - name: Validate observation completeness, not release parity
        if: ${{ !cancelled() }}
        run: python3 scripts/check-section-sample-observation.py section-sample-evidence/native > section-sample-evidence/checker.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section-samples-${{ matrix.runner }}
          path: section-sample-evidence/
          if-no-files-found: error
