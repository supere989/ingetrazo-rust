name: Isolated native Metal ordered compute consumer
on:
  push:
    branches-ignore: [review/metal-raw-canvas, review/metal-world-classic, review/metal-world-material]
    paths:
      - '.github/workflows/metal-compute-consumer.yml'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - 'vendor/**'
      - 'crates/ingetrazo-metal/**'
      - 'crates/ingetrazo-render/**'
      - 'crates/ingetrazo-core/**'
      - 'docs/audits/metal-cad2d-offscreen/original/**'
      - 'docs/audits/metal-compute-callback/source/**'
      - 'scripts/reference-metal-*.py'
      - 'scripts/check-metal-*.py'
  pull_request:
  workflow_dispatch:
# Finish active pushes and save caches; keep the latest queued push.
# Pull-request updates still cancel superseded checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# CI needs executable checks, not retained debug/incremental build trees.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
jobs:
  native-compute-consumer:
    name: Actual ordered UI and CAD compute (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Reuse compiled Cargo dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-bin: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned diagnostic Qt reference
        run: python -m pip install PySide6==6.12.0
      - name: Generate fresh actual QPainter references
        run: |
          mkdir -p docs/audits/metal-compute-consumer-ci
          python scripts/reference-metal-cad2d.py docs/audits/metal-compute-consumer-ci/reference/alpha > docs/audits/metal-compute-consumer-ci/qt-alpha.log 2>&1
          python scripts/reference-metal-compute-order.py docs/audits/metal-compute-consumer-ci/reference/mixed > docs/audits/metal-compute-consumer-ci/qt-mixed.log 2>&1
      - name: Build native compute consumer with source provenance
        run: |
          git rev-parse HEAD > docs/audits/metal-compute-consumer-ci/revision.txt
          rustc -Vv > docs/audits/metal-compute-consumer-ci/toolchain.txt
          cargo build --locked -p ingetrazo-metal --example cad_compute_callback_probe > docs/audits/metal-compute-consumer-ci/build.log 2>&1
          shasum -a 256 target/debug/examples/cad_compute_callback_probe > docs/audits/metal-compute-consumer-ci/binary.sha256
          otool -L target/debug/examples/cad_compute_callback_probe > docs/audits/metal-compute-consumer-ci/frameworks.txt
      - name: Execute actual GPU consumer and strict seven-image controls
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          root=Path('docs/audits/metal-compute-consumer-ci')
          cmd=['target/debug/examples/cad_compute_callback_probe','--output='+str(root/'native')]
          with (root/'execution.log').open('w') as log:
              try:
                  run=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=90)
              except subprocess.TimeoutExpired:
                  log.write('\nExternal bounded GPU probe timeout; no acceptance claimed\n')
                  raise
          if run.returncode:raise SystemExit(run.returncode)
          PY
          python scripts/check-metal-compute-callback.py docs/audits/metal-compute-consumer-ci/native docs/audits/metal-compute-consumer-ci/reference > docs/audits/metal-compute-consumer-ci/strict-check.json
      - name: Retain complete native evidence on every verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-compute-consumer-${{ matrix.runner }}
          path: docs/audits/metal-compute-consumer-ci/
          if-no-files-found: error
